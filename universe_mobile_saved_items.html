<!-- JavaScript for interaction touches (heart toggle, back navigation) -->
<script data-purpose="card-interactions">
    document.addEventListener('DOMContentLoaded', () => {
      // Toggle saved state on heart click
      const heartButtons = document.querySelectorAll('[data-purpose="product-card"] button');
      heartButtons.forEach(button => {
        button.addEventListener('click', (e) => {
          e.stopPropagation();
          const svg = button.querySelector('svg');
          if (svg.classList.contains('fill-rose-500')) {
            svg.classList.remove('fill-rose-500', 'text-rose-500');
            svg.classList.add('fill-none', 'stroke-current', 'text-slate-400');
            svg.setAttribute('stroke-width', '2');
          } else {
            svg.classList.remove('fill-none', 'stroke-current', 'text-slate-400');
            svg.classList.add('fill-rose-500', 'text-rose-500');
            svg.removeAttribute('stroke-width');
          }
        });
      });
    });
  </script>
