<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>

                      "surface-dim": "#d9d9e5",

                      "primary-container": "#2563eb",

                      "inverse-primary": "#b4c5ff",
                      "surface-tint": "#0053db",
                      "primary": "#004ac6",
                      "inverse-on-surface": "#f0f0fb",
                      "outline": "#737686",
                      "surface-container": "#ededf9",
                      "outline-variant": "#c3c6d7",
                      "on-primary-container": "#eeefff",
                      "on-primary-fixed-variant": "#003ea8",
                      "on-tertiary-fixed": "#360f00",
                      "on-surface": "#191b23",
                      "secondary": "#565e74",
                      "secondary-fixed-dim": "#bec6e0",
                      "on-error-container": "#93000a",

              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",

              "spacing": {

                      "container-max": "1440px",
                      "margin-mobile": "16px",

                      "stack-lg": "32px",
                      "gutter": "24px",
                      "margin-desktop": "40px"
              },
              "fontFamily": {

                      ],

</head>
<body class="bg-background text-on-background min-h-screen flex antialiased">
<!-- Modal Backdrop / Container -->
<main class="flex-1 flex justify-center items-start pt-margin-desktop px-margin-mobile md:px-margin-desktop pb-margin-desktop bg-surface-variant/30 min-h-screen">
<!-- Add Product Modal Card -->
<div class="bg-surface w-full max-w-3xl rounded-xl shadow-lg border border-border overflow-hidden">
<!-- Modal Header -->
<header class="flex justify-between items-center px-gutter py-4 border-b border-border bg-surface-container-lowest">
<div>
<h1 class="font-headline-md text-headline-md text-on-surface">Add New Product</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-1">Fill in the details to list a new item in your Global Store.</p>
</div>
<button aria-label="Close modal" class="text-on-surface-variant hover:text-on-surface transition-colors p-2 rounded-full hover:bg-surface-container-low">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
</header>
<!-- Modal Body (Form) -->
<div class="p-gutter">
<form class="space-y-stack-lg">
<!-- Basic Info Section -->
<section class="space-y-stack-md">
<h2 class="font-headline-sm text-headline-sm text-on-surface border-b border-surface-variant pb-2">Basic Information</h2>
<div class="grid grid-cols-1 md:grid-cols-2 gap-gutter">
<div class="space-y-2">
<label class="block font-body-sm text-body-sm text-on-surface font-medium" for="productName">Product Name <span class="text-error">*</span></label>
<input class="w-full bg-surface-container-lowest border border-border rounded-lg px-4 py-2 font-body-md text-body-md focus:outline-none focus:border-primary-container focus:ring-2 focus:ring-primary-container/20 transition-all placeholder:text-outline-variant text-on-surface" id="productName" placeholder="e.g. Minimalist Ceramic Vase" type="text"/>
</div>
<div class="space-y-2">
<label class="block font-body-sm text-body-sm text-on-surface font-medium" for="sku">SKU (Stock Keeping Unit)</label>
<input class="w-full bg-surface-container-lowest border border-border rounded-lg px-4 py-2 font-body-md text-body-md focus:outline-none focus:border-primary-container focus:ring-2 focus:ring-primary-container/20 transition-all placeholder:text-outline-variant text-on-surface" id="sku" placeholder="e.g. VASE-CER-001" type="text"/>
</div>
</div>
<div class="space-y-2">
<label class="block font-body-sm text-body-sm text-on-surface font-medium" for="description">Description</label>
<textarea class="w-full bg-surface-container-lowest border border-border rounded-lg px-4 py-3 font-body-md text-body-md focus:outline-none focus:border-primary-container focus:ring-2 focus:ring-primary-container/20 transition-all placeholder:text-outline-variant text-on-surface resize-y" id="description" placeholder="Describe the product features, materials, and care instructions..." rows="4"></textarea>
</div>
</section>
<!-- Pricing & Inventory Section -->
<section class="space-y-stack-md">
<h2 class="font-headline-sm text-headline-sm text-on-surface border-b border-surface-variant pb-2">Pricing &amp; Inventory</h2>
<div class="grid grid-cols-1 md:grid-cols-3 gap-gutter">
<div class="space-y-2">
<label class="block font-body-sm text-body-sm text-on-surface font-medium" for="price">Regular Price <span class="text-error">*</span></label>
<div class="relative">
<span class="absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant font-body-md text-body-md">$</span>
<input class="w-full bg-surface-container-lowest border border-border rounded-lg pl-8 pr-4 py-2 font-body-md text-body-md focus:outline-none focus:border-primary-container focus:ring-2 focus:ring-primary-container/20 transition-all placeholder:text-outline-variant text-on-surface" id="price" placeholder="0.00" type="number"/>
</div>
</div>
<div class="space-y-2">
<label class="block font-body-sm text-body-sm text-on-surface font-medium" for="salePrice">Sale Price</label>
<div class="relative">
<span class="absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant font-body-md text-body-md">$</span>
<input class="w-full bg-surface-container-lowest border border-border rounded-lg pl-8 pr-4 py-2 font-body-md text-body-md focus:outline-none focus:border-primary-container focus:ring-2 focus:ring-primary-container/20 transition-all placeholder:text-outline-variant text-on-surface" id="salePrice" placeholder="0.00" type="number"/>
</div>
</div>
<div class="space-y-2">
<label class="block font-body-sm text-body-sm text-on-surface font-medium" for="stock">Initial Stock <span class="text-error">*</span></label>
<input class="w-full bg-surface-container-lowest border border-border rounded-lg px-4 py-2 font-body-md text-body-md focus:outline-none focus:border-primary-container focus:ring-2 focus:ring-primary-container/20 transition-all placeholder:text-outline-variant text-on-surface" id="stock" placeholder="0" type="number"/>
</div>
</div>
</section>
<!-- Media Section -->
<section class="space-y-stack-md">
<div class="flex justify-between items-center border-b border-surface-variant pb-2">
<h2 class="font-headline-sm text-headline-sm text-on-surface">Product Images</h2>
<span class="font-body-sm text-body-sm text-on-surface-variant">Max 5 images, up to 5MB each</span>
</div>
<!-- Upload Area -->
<div class="border-2 border-dashed border-border hover:border-primary-container rounded-xl p-8 flex flex-col items-center justify-center bg-surface-container-lowest transition-colors cursor-pointer group">
<div class="bg-primary-container/10 p-3 rounded-full mb-3 group-hover:bg-primary-container/20 transition-colors">
<span class="material-symbols-outlined text-primary-container text-3xl" data-icon="cloud_upload">cloud_upload</span>
</div>
<p class="font-body-md text-body-md text-on-surface mb-1"><span class="text-primary-container font-semibold">Click to upload</span> or drag and drop</p>
<p class="font-body-sm text-body-sm text-on-surface-variant">SVG, PNG, JPG or GIF</p>
</div>
<!-- Image Preview Thumbnails (Empty State visualization) -->
<div class="flex gap-4 overflow-x-auto py-2">
<div class="h-24 w-24 rounded-lg border border-border bg-surface-container flex items-center justify-center text-outline-variant flex-shrink-0">
<span class="material-symbols-outlined" data-icon="image">image</span>
</div>
</div>
</section>
</form>
</div>
<!-- Modal Footer (Actions) -->
<footer class="px-gutter py-4 border-t border-border bg-surface-container-lowest flex justify-end gap-3">
<button class="px-6 py-2 rounded-lg font-body-md text-body-md font-medium text-on-surface bg-surface border border-border hover:bg-surface-container-low transition-colors" type="button">
                    Cancel
                </button>
<button class="px-6 py-2 rounded-lg font-body-md text-body-md font-medium text-on-primary bg-primary-container hover:opacity-90 shadow-sm transition-all flex items-center gap-2" type="submit">
<span class="material-symbols-outlined text-[20px]" data-icon="save">save</span>
                    Save Product
                </button>
</footer>
</div>
</main>
</body></html>
